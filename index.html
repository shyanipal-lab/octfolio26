<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shyani Pal | Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <script>
      window.global = window;
      window.process = window.process || { env: {} };
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.error('Initial script load error:', e);
        }
      });
    </script>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #ffffff; color: #64748b;">
        <div style="font-size: 28px; animation: pulse 1.5s infinite ease-in-out;">✨</div>
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Loading Portfolio...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
